name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run of the same branch or pull request makes the older one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The same names and values as `pnpm test:integration`; the compose file below publishes
      # Postgres and MinIO on these ports.
      PINWALL_TEST_POSTGRES_URL: postgres://pinwall:pinwall@localhost:55432/pinwall
      PINWALL_TEST_S3_ENDPOINT: http://localhost:59000
      PINWALL_TEST_S3_BUCKET: pinwall-test
      PINWALL_TEST_S3_ACCESS_KEY_ID: pinwall
      PINWALL_TEST_S3_SECRET_ACCESS_KEY: pinwall-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Postgres 17 and MinIO (with the test bucket) from the file developers use locally. A
      # GitHub service container cannot give MinIO its `server /data` command, so both start here.
      - name: Start Postgres and MinIO
        run: docker compose -f docker-compose.test.yml up -d --wait

      - run: pnpm test

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the size gate (tools/) runs on the runner; the image builds its own dependencies.
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile --filter @pinwall/tools

      # QEMU runs the arm64 image on this amd64 runner; Buildx builds both platforms.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One build per platform, each loaded into the local Docker so it can be measured and run,
      # and each with its own build cache. No provenance or SBOM here: the release builds those.
      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pinwall:ci-amd64
          build-args: PINWALL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          sbom: false

      - name: Build arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pinwall:ci-arm64
          build-args: PINWALL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

      # Each platform must stay under 200 MB compressed.
      - name: Image size
        run: |
          pnpm image:size pinwall:ci-amd64
          pnpm image:size pinwall:ci-arm64

      # The image's own health check has to turn healthy, and the migrate command has to run,
      # with a read-only root filesystem and no capabilities.
      - name: Smoke test amd64
        run: |
          docker run --detach --name pinwall-smoke --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 8080:8080 pinwall:ci-amd64
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' pinwall-smoke)" = healthy ] && break
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8080/healthz
          curl --fail --silent --show-error http://localhost:8080/readyz
          docker exec pinwall-smoke pinwall migrate

      # `pinwall version` would not load the native SQLite module; migrating a database does, so
      # this proves the arm64 image carries the arm64 binary.
      - name: Smoke test arm64
        run: |
          output="$(docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp \
            -v pw-arm64:/data pinwall:ci-arm64 migrate 2>&1)"
          echo "$output"
          grep --quiet migrated <<< "$output"

      - name: Check the image layout
        run: |
          docker run --rm --entrypoint sh pinwall:ci-amd64 -c \
            'test -s /app/THIRD_PARTY_NOTICES && grep -q "^hono " /app/THIRD_PARTY_NOTICES && ! command -v npm'
          [ "$(docker run --rm --entrypoint id pinwall:ci-amd64 -u)" = 10001 ]

      - name: Show container logs after a failure
        if: failure()
        run: docker logs pinwall-smoke || true

  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Which packages ship is read from the build's own output, so the check follows a build.
      - run: pnpm build
      - run: pnpm licenses:check
