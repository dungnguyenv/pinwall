name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

# A newer run of the same branch or pull request makes the older one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The same names and values as `pnpm test:integration`; the compose file below publishes
      # Postgres and MinIO on these ports.
      PINWALL_TEST_POSTGRES_URL: postgres://pinwall:pinwall@localhost:55432/pinwall
      PINWALL_TEST_S3_ENDPOINT: http://localhost:59000
      PINWALL_TEST_S3_BUCKET: pinwall-test
      PINWALL_TEST_S3_ACCESS_KEY_ID: pinwall
      PINWALL_TEST_S3_SECRET_ACCESS_KEY: pinwall-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Postgres 17 and MinIO (with the test bucket) from the file developers use locally. A
      # GitHub service container cannot give MinIO its `server /data` command, so both start here.
      - name: Start Postgres and MinIO
        run: docker compose -f docker-compose.test.yml up -d --wait

      - run: pnpm test

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the size gate (tools/) runs on the runner; the image builds its own dependencies.
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile --filter @pinwall/tools

      # QEMU runs the arm64 image on this amd64 runner; Buildx builds both platforms.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One build per platform, each loaded into the local Docker so it can be measured and run,
      # and each with its own build cache. No provenance or SBOM here: the release builds those.
      - name: Build amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pinwall:ci-amd64
          build-args: PINWALL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          provenance: false
          sbom: false

      - name: Build arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pinwall:ci-arm64
          build-args: PINWALL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          provenance: false
          sbom: false

      # Each platform must stay under 200 MB compressed.
      - name: Image size
        run: |
          pnpm image:size pinwall:ci-amd64
          pnpm image:size pinwall:ci-arm64

      # The image's own health check has to turn healthy, and the migrate command has to run,
      # with a read-only root filesystem and no capabilities.
      - name: Smoke test amd64
        run: |
          docker run --detach --name pinwall-smoke --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 8080:8080 pinwall:ci-amd64
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' pinwall-smoke)" = healthy ] && break
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8080/healthz
          curl --fail --silent --show-error http://localhost:8080/readyz
          docker exec pinwall-smoke pinwall migrate

      # `pinwall version` would not load the native SQLite module; migrating a database does, so
      # this proves the arm64 image carries the arm64 binary.
      - name: Smoke test arm64
        run: |
          output="$(docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp \
            -v pw-arm64:/data pinwall:ci-arm64 migrate 2>&1)"
          echo "$output"
          grep --quiet migrated <<< "$output"

      - name: Check the image layout
        run: |
          docker run --rm --entrypoint sh pinwall:ci-amd64 -c \
            'test -s /app/THIRD_PARTY_NOTICES && grep -q "^hono " /app/THIRD_PARTY_NOTICES && ! command -v npm'
          [ "$(docker run --rm --entrypoint id pinwall:ci-amd64 -u)" = 10001 ]

      - name: Show container logs after a failure
        if: failure()
        run: docker logs pinwall-smoke || true

  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Which packages ship is read from the build's own output, so the check follows a build.
      - run: pnpm build
      - run: pnpm licenses:check

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
          checksum-policy: required

      # kubeconform validates the rendered manifests against the Kubernetes schemas. The tarball
      # is checked against the release's CHECKSUMS and against the hash pinned here, so a changed
      # release asset cannot slip in. To update: change both values from the new release.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl --fail --silent --show-error --location --output kubeconform.tar.gz \
            "${base}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output CHECKSUMS "${base}/CHECKSUMS"
          listed="$(awk '$2 == "kubeconform-linux-amd64.tar.gz" { print $1 }' CHECKSUMS)"
          [ "${listed}" = "${KUBECONFORM_SHA256}" ]
          echo "${listed}  kubeconform.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf kubeconform.tar.gz -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Lints the chart, renders it for every file in deploy/helm/pinwall/ci, validates the output
      # (the ServiceMonitor schema is fetched from the CRDs catalog) and checks the hardening
      # rules, including that every unsafe set of values is refused.
      - run: pnpm chart:check

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint (with shellcheck for the run scripts) checks every workflow. The image is
      # rhysd/actionlint 1.7.12, pinned by the digest of its multi-platform index.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Each suite below runs even when an earlier one failed, so one run reports them all.
      - name: Web shell and review suites
        run: pnpm test:e2e

      - name: Annotator suite
        if: ${{ !cancelled() }}
        run: pnpm --filter @pinwall/server test:e2e:annotator

      # Keycloak runs in Docker; its image is pinned by digest in e2e/keycloak/global-setup.ts.
      - name: Keycloak sign-in suite
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:keycloak

      - name: Upload Playwright reports after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            e2e/report/
            e2e/test-results/
            apps/server/e2e/annotator/test-results/
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The test stack below, so the OIDC and MCP flow suites also run on Postgres; the same names
      # and values as `pnpm test:integration`.
      PINWALL_TEST_POSTGRES_URL: postgres://pinwall:pinwall@localhost:55432/pinwall
      PINWALL_TEST_S3_ENDPOINT: http://localhost:59000
      PINWALL_TEST_S3_BUCKET: pinwall-test
      PINWALL_TEST_S3_ACCESS_KEY_ID: pinwall
      PINWALL_TEST_S3_SECRET_ACCESS_KEY: pinwall-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start Postgres and MinIO
        run: docker compose -f docker-compose.test.yml up -d --wait

      # The image the acceptance specs run, built once here and loaded into the local Docker. It
      # reads the amd64 build cache that the image job writes.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pinwall:acceptance
          build-args: PINWALL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          provenance: false
          sbom: false

      # Every automated acceptance item; the images the specs start besides Pinwall (Keycloak,
      # Postgres, Silo) are pinned by digest in the specs.
      - name: Acceptance suites
        env:
          PINWALL_ACCEPTANCE_IMAGE: pinwall:acceptance
        run: pnpm test:acceptance

      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report
          path: e2e/acceptance-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright reports after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-playwright-reports
          path: |
            e2e/report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs after a failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=100
