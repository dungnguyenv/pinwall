name: Release

# Pushing a tag v<version> releases that version: the multi-arch image and the Helm chart, both
# signed with cosign (keyless) and with build provenance, the image's SBOM, and a GitHub release
# with the changelog's section. The tag must match the versions in the repository (see `verify`).
#
# No job that can publish runs a package install or a repository script: a job with
# `id-token: write` lets every process in it obtain a signing identity for this workflow, and a
# step can change what later steps run. So `verify` and `prepare` do the scripted work with read
# access only, and `image`, `chart` and `release` run only pinned actions, docker, helm, cosign
# and gh. (The image's own install runs inside the Docker build, which gets no token.) The
# release installs no cached dependencies either: everything comes by the lockfile's hashes.
on:
  push:
    tags: ["v*"]

# One run per tag at a time. A second run of the same tag waits; a release is never cancelled
# halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: each job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/dungnguyenv/pinwall
  CHARTS: ghcr.io/dungnguyenv/charts

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile --filter @pinwall/tools

      # The tag must be v<version> for the version that every package.json and the chart carry,
      # and CHANGELOG.md must have a section for it. Otherwise the release stops here, before
      # anything is built or published.
      - name: Check the tag against the repository
        env:
          TAG: ${{ github.ref_name }}
        run: pnpm --filter @pinwall/tools exec tsx src/release.ts check "$TAG"

      # The check accepted the tag, so it is "v" and a SemVer version. A pre-release gets its own
      # image tag only: <major>.<minor>, <major> and latest stay on the last full release.
      - name: Work out the version and the image tags
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            prerelease=true
            tags="${IMAGE}:${version}"
          else
            prerelease=false
            IFS=. read -r major minor _ <<< "$version"
            tags="${IMAGE}:${version},${IMAGE}:${major}.${minor},${IMAGE}:${major},${IMAGE}:latest"
          fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: CI
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      SBOM_FILE: pinwall-${{ needs.verify.outputs.version }}.spdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # QEMU runs the arm64 stage's few commands on this amd64 runner; Buildx builds both.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One push for both platforms, so the digest is the multi-platform index's. No build cache:
      # the release image is built from the tagged sources alone. The attestations below take
      # the place of BuildKit's own provenance and SBOM.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            PINWALL_VERSION=${{ needs.verify.outputs.version }}
            PINWALL_REVISION=${{ github.sha }}
          tags: ${{ needs.verify.outputs.tags }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow and the tag, which is what SECURITY.md's
      # `cosign verify` checks.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist for organization-owned repositories only.
          create-storage-record: false

      # Syft reads the image from the registry, for the runner's platform (linux/amd64); the
      # arm64 image differs only in the native SQLite binary.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ env.SBOM_FILE }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ env.SBOM_FILE }}
          push-to-registry: true

      # The release carries the very notices file the image ships.
      - name: Copy the third-party notices out of the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          container="$(docker create --platform linux/amd64 "${IMAGE}@${DIGEST}")"
          docker cp "${container}:/app/THIRD_PARTY_NOTICES" THIRD_PARTY_NOTICES
          docker rm "${container}"
          test -s THIRD_PARTY_NOTICES

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            ${{ env.SBOM_FILE }}
            THIRD_PARTY_NOTICES
          if-no-files-found: error

  prepare:
    name: Prepare the chart and the notes
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHART_FILE: dist/pinwall-${{ needs.verify.outputs.version }}.tgz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
          checksum-policy: required

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile --filter @pinwall/tools

      # Chart version and appVersion from the tag, and the image by the digest just pushed.
      - name: Set the chart's version and image
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: pnpm --filter @pinwall/tools exec tsx src/release.ts chart "$TAG" "$DIGEST"

      - name: Package the chart
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          helm package deploy/helm/pinwall -d dist
          helm show values "$CHART_FILE" | grep --quiet --fixed-strings "digest: \"${DIGEST}\""

      # The changelog's section for the version, then the image by digest and how to verify it.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: pnpm --filter @pinwall/tools exec tsx src/release.ts notes "$TAG" "$DIGEST" --out dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: ${{ env.CHART_FILE }}
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: dist/notes.md
          if-no-files-found: error

  chart:
    name: Chart
    needs: [verify, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      CHART_FILE: dist/pinwall-${{ needs.verify.outputs.version }}.tgz
    steps:
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
          checksum-policy: required

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-chart
          path: dist

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # cosign reads Docker's registry login; helm keeps its own (below).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # helm push prints "Digest: sha256:…", the digest of the chart's OCI manifest.
      - name: Push the chart
        id: push
        env:
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          output="$(helm push "$CHART_FILE" "oci://${CHARTS}")"
          echo "$output"
          digest="$(sed -n 's/^Digest: //p' <<< "$output")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "helm push printed no chart digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHARTS}/pinwall@${DIGEST}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.CHART_FILE }}

  release:
    name: GitHub release
    needs: [verify, image, prepare, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The SBOM and the notices (image), the chart and the notes (prepare).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Pinwall ${VERSION}" \
            --notes-file release-files/notes.md "${prerelease[@]}" \
            "release-files/pinwall-${VERSION}.tgz" \
            "release-files/pinwall-${VERSION}.spdx.json" \
            release-files/THIRD_PARTY_NOTICES
