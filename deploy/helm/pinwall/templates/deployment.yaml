{{- include "pinwall.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinwall.fullname" . }}
  labels:
    {{- include "pinwall.labels" . | nindent 4 }}
spec:
  # One instance: Pinwall keeps state in one database and in memory, so this is not a value.
  replicas: 1
  # The old pod stops before the new one starts, so two never share the data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pinwall.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pinwall.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pinwall.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Kubernetes would put the Service's address in variables named after it, such as
      # PINWALL_PORT=tcp://10.0.0.1:80 for a Service called pinwall, which is also a setting of
      # Pinwall's.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Admitted by the Pod Security "restricted" profile. The image's user is 10001; fsGroup makes
      # a volume that starts out owned by root writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pinwall
          image: {{ include "pinwall.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ include "pinwall.httpPort" . }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: PINWALL_PUBLIC_ORIGIN
              value: {{ .Values.publicOrigin | quote }}
            - name: PINWALL_METRICS_PORT
              value: {{ if .Values.metrics.enabled }}{{ .Values.metrics.port | toString | quote }}{{ else }}"0"{{ end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ include "pinwall.envValue" $value | quote }}
            {{- end }}
            {{- range $name, $key := .Values.secretFiles }}
            - name: {{ $name }}_FILE
              value: {{ printf "%s/%s" (include "pinwall.secretsDir" $) $key | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secretFiles }}
            - name: secrets
              mountPath: {{ include "pinwall.secretsDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "pinwall.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.secretFiles }}
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              {{- range $key := (values .Values.secretFiles | uniq | sortAlpha) }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
