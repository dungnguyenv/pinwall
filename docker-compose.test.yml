# Throwaway services for integration tests (`pnpm test:integration`). Data lives in tmpfs and
# is gone when the containers stop. Ports bind to loopback only.
name: pinwall-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pinwall
      POSTGRES_USER: pinwall
      POSTGRES_PASSWORD: pinwall
    # Durability is pointless for a test database; these settings make it fast.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP check: the init-time server listens on the socket only, so this waits for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pinwall", "-d", "pinwall"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pinwall
      MINIO_ROOT_PASSWORD: pinwall-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set test http://minio:9000 pinwall pinwall-secret &&
        mc mb --ignore-existing test/pinwall-test
    restart: "no"

  # `up --wait` reports a one-shot container that has exited as a failure unless another
  # service waits for it to complete. This idle service does that, so `--wait` returns once
  # Postgres is healthy and the bucket exists.
  ready:
    image: postgres:17-alpine
    entrypoint: ["sleep", "2147483647"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
