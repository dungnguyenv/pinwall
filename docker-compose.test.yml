# Throwaway services for integration tests (`pnpm test:integration`). Data lives in tmpfs and
# is gone when the containers stop. Ports bind to loopback only. Every image is pinned by digest
# (the tag is there to read); to update one, take the new index digest from
# `docker buildx imagetools inspect <name>:<tag>`.
name: pinwall-test

services:
  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_DB: pinwall
      POSTGRES_USER: pinwall
      POSTGRES_PASSWORD: pinwall
    # Durability is pointless for a test database; these settings make it fast.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP check: the init-time server listens on the socket only, so this waits for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pinwall", "-d", "pinwall"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio:
    # MinIO no longer publishes container images, so this is Silo, a maintained fork of its last
    # community release (the Compose example uses it too). It keeps MinIO's S3 API, its MINIO_*
    # variables and its `mc` client.
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z@sha256:08ce1505b5eacefbad1ca07159b242b9ce045a11c2817e3bc257b25f77bbc02d
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pinwall
      MINIO_ROOT_PASSWORD: pinwall-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 60

  minio-init:
    # The same image: it carries the `mc` client.
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z@sha256:08ce1505b5eacefbad1ca07159b242b9ce045a11c2817e3bc257b25f77bbc02d
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set test http://minio:9000 pinwall pinwall-secret &&
        mc mb --ignore-existing test/pinwall-test
    restart: "no"

  # `up --wait` reports a one-shot container that has exited as a failure unless another
  # service waits for it to complete. This idle service does that, so `--wait` returns once
  # Postgres is healthy and the bucket exists.
  ready:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    entrypoint: ["sleep", "2147483647"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
